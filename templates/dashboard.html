{% extends "base.html" %}
{% block page_title %}{{ page_title }}{% endblock %}

{% block header %}
    <!-- Next tag loads Charts.js https://www.chartjs.org/docs/latest/ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.6.2/chart.min.js"
            integrity="sha512-tMabqarPtykgDtdtSqCL3uLVM0gS1ZkUAVhRFu1vSEFgvB73niFQWJuvviDyBGBH22Lcau4rHB5p2K2T0Xvr6Q=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
{% endblock %}

{% block content %}

    <!--
    Examples of what to show in Dashboard:

    - Ranking of visited documents (from results page)
    - Visitor's preferred browsers
    - Visitor's city (from IP)
    - preferred queries ranking
    - preferred terms
    - etc.

    -->

    <h3>Dashboard</h3>

    <h4>Consultes per dia</h4>
    <canvas id="queriesPerDay"></canvas>
    <script>
      new Chart(document.getElementById('queriesPerDay'), {
        type: 'line',
        data: {
          labels: {{ queries_per_day_labels|tojson }},
          datasets: [{
            label: 'Consultes per dia',
            data: {{ queries_per_day_counts|tojson }},
            borderColor: 'blue',
            fill: false
          }]
        }
      });
    </script>
    
    <h4>Navegadors més utilitzats</h4>
    <canvas id="browsersChart"></canvas>
    <script>
      const browsersData = {{ browsers|tojson }};
      new Chart(document.getElementById('browsersChart'), {
        type: 'bar',
        data: {
          labels: browsersData.map(b => b.browser),
          datasets: [{
            label: 'Usuaris per navegador',
            data: browsersData.map(b => b.total),
            backgroundColor: 'green'
          }]
        }
      });
    </script>
    
    <h4>Sistemes operatius més utilitzats</h4>
    <canvas id="osChart"></canvas>
    <script>
      const osData = {{ os_data|tojson }};
      new Chart(document.getElementById('osChart'), {
        type: 'bar',
        data: {
          labels: osData.map(o => o.os),
          datasets: [{
            label: 'Usuaris per OS',
            data: osData.map(o => o.total),
            backgroundColor: 'orange'
          }]
        }
      });
    </script>
    
    <h4>Clics retornats als resultats</h4>
    <canvas id="clicksReturnedChart"></canvas>
    <script>
      const clicksData = {{ clicks_returned|tojson }};
      new Chart(document.getElementById('clicksReturnedChart'), {
        type: 'pie',
        data: {
          labels: clicksData.map(c => c.returned_to_results),
          datasets: [{
            data: clicksData.map(c => c.total),
            backgroundColor: ['red','blue']
          }]
        }
      });
    </script>    


{% endblock %}
